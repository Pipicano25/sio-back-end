name: keycloak-vps

# Keycloak de SIO en la VPS (Docker Compose), independiente de los microservicios. No reemplaza ni
# modifica la definición de desarrollo (servicio "keycloak" de infrastructure/compose.yaml):
# - Proyecto "keycloak-vps": en un equipo de desarrollo no toma los contenedores del proyecto "sio".
# - Misma imagen que en desarrollo: Containerfile de esta carpeta (build optimizado con PostgreSQL,
#   health y metrics), versión KEYCLOAK_VERSION de .env.vps.
# - Base: contenedor existente sio-postgres-18 (base keycloak ya migrada) en sio-network. Este archivo
#   NO crea bases ni importa realms: arranca con `start --optimized`, sin --import-realm y sin montar
#   el realm, así que realms, usuarios, clientes, roles, grupos y flujos se conservan tal como están.
# - Red externa sio-network con el alias "keycloak": los microservicios piden tokens y llaves en
#   http://keycloak:8080 (KEYCLOAK_TOKEN_URL, SIO_AUTH_JWKS_URL de sus .env.vps).
# - Producción detrás de un proxy inverso con HTTPS: el proxy termina TLS y reenvía a
#   127.0.0.1:8081 por HTTP con los encabezados X-Forwarded-*. La URL pública es KC_HOSTNAME.
# - Puerto de administración (health y metrics, 9000) solo en 127.0.0.1; nunca se publica en el proxy.
#
# Desde la raíz del repositorio:
#   docker compose -f infrastructure/keycloak/docker-compose.vps.yml --env-file infrastructure/keycloak/.env.vps build
#   docker compose -f infrastructure/keycloak/docker-compose.vps.yml --env-file infrastructure/keycloak/.env.vps up -d

services:
  keycloak:
    build:
      context: .
      dockerfile: Containerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.7.0}
    image: sio/keycloak:${KEYCLOAK_VERSION:-26.7.0}
    container_name: sio-keycloak
    restart: unless-stopped
    init: true
    command:
      - start
      - --optimized
    env_file:
      - .env.vps
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8081}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - sio-network

networks:
  sio-network:
    name: sio-network
    external: true
