name: purchase-service

# Proyecto compose "purchase-service" (única definición Compose del microservicio):
# base de datos propia, base de pruebas (perfil test), contenedor de aplicación,
# audit-outbox-worker y conciliador de operaciones pendientes (misma imagen).
# La base, la aplicación y los procesos auxiliares se unen a "sio-network",
# creada por el proyecto "sio" (infrastructure/compose.yaml), que debe estar
# levantado antes: ahí vive Keycloak (depends_on no cruza proyectos; el orden lo
# garantiza infrastructure/scripts/rebuild-all.sh).

x-purchase-environment: &purchase-environment
  DATABASE_URL: postgresql+psycopg://${PURCHASE_DB_USER}:${PURCHASE_DB_PASSWORD}@purchase-db:5432/${PURCHASE_DB_NAME}
  # El issuer debe coincidir con KEYCLOAK_PUBLIC_URL; las llaves se obtienen
  # dentro de sio-network.
  SIO_AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
  SIO_AUTH_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
  SIO_AUTH_AUDIENCE: sio-api
  SIO_DOCS_ENABLED: ${SIO_DOCS_ENABLED:-false}
  # Dependencias (specs/014-purchase-core/contracts/dependencies.md). Las URL
  # incluyen /api/v1, salvo Payment Reference. Sin dependencia de arranque: si
  # no están disponibles, las operaciones responden 503 con la dependencia.
  OPERATIONAL_CONTEXT_SERVICE_BASE_URL: http://operational-context-service:8000/api/v1
  OPERATIONAL_CONTEXT_TIMEOUT_SECONDS: ${OPERATIONAL_CONTEXT_TIMEOUT_SECONDS:-5}
  COMMERCIAL_RELATIONSHIP_SERVICE_BASE_URL: http://commercial-relationship-service:8000/api/v1
  COMMERCIAL_RELATIONSHIP_TIMEOUT_SECONDS: ${COMMERCIAL_RELATIONSHIP_TIMEOUT_SECONDS:-5}
  PRODUCT_CATALOG_SERVICE_BASE_URL: http://product-catalog-service:8000/api/v1
  PRODUCT_CATALOG_TIMEOUT_SECONDS: ${PRODUCT_CATALOG_TIMEOUT_SECONDS:-5}
  PARTY_IDENTITY_SERVICE_BASE_URL: http://party-identity-service:8000/api/v1
  PARTY_IDENTITY_TIMEOUT_SECONDS: ${PARTY_IDENTITY_TIMEOUT_SECONDS:-5}
  PAYMENT_REFERENCE_SERVICE_BASE_URL: http://payment-reference-service:8000
  PAYMENT_REFERENCE_TIMEOUT_SECONDS: ${PAYMENT_REFERENCE_TIMEOUT_SECONDS:-5}
  INVENTORY_SERVICE_BASE_URL: http://inventory-service:8000/api/v1
  INVENTORY_TIMEOUT_SECONDS: ${INVENTORY_TIMEOUT_SECONDS:-10}
  PURCHASE_LOOKUP_CONCURRENCY: ${PURCHASE_LOOKUP_CONCURRENCY:-8}
  PURCHASE_LOCK_TIMEOUT_SECONDS: ${PURCHASE_LOCK_TIMEOUT_SECONDS:-5}
  PURCHASE_RECONCILER_INTERVAL_SECONDS: ${PURCHASE_RECONCILER_INTERVAL_SECONDS:-60}
  PURCHASE_RECONCILER_THRESHOLD_SECONDS: ${PURCHASE_RECONCILER_THRESHOLD_SECONDS:-300}
  # Identidad técnica propia (client_credentials, D5).
  KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
  PURCHASE_CLIENT_ID: purchase-service
  PURCHASE_CLIENT_SECRET: ${PURCHASE_SERVICE_CLIENT_SECRET}

services:
  purchase-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-purchase-db
    environment:
      POSTGRES_DB: ${PURCHASE_DB_NAME}
      POSTGRES_USER: ${PURCHASE_DB_USER}
      POSTGRES_PASSWORD: ${PURCHASE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PURCHASE_DB_PORT}:5432"
    volumes:
      - purchase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PURCHASE_DB_USER} -d ${PURCHASE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Base de pruebas (perfil "test"): solo se levanta a pedido, desde la raíz:
  #   docker compose --file infrastructure/services/purchase-service.yaml --env-file infrastructure/.env --profile test up -d purchase-test-db
  # Datos en tmpfs (se pierden al detenerla). No usa sio-network: las pruebas
  # la alcanzan por el host (PURCHASE_TEST_DATABASE_URL del .env del servicio).
  purchase-test-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sio-purchase-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${PURCHASE_TEST_DB_NAME:-sio_purchase_test}
      POSTGRES_USER: ${PURCHASE_TEST_DB_USER:-sio_purchase_test}
      POSTGRES_PASSWORD: ${PURCHASE_TEST_DB_PASSWORD:-sio_purchase_test_dev_change_me}
    ports:
      - "127.0.0.1:${PURCHASE_TEST_DB_PORT:-55445}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  purchase-service:
    build:
      context: ../..
      dockerfile: services/purchase-service/Dockerfile
    image: sio/purchase-service:${SIO_SERVICES_VERSION}
    container_name: sio-purchase-service
    restart: unless-stopped
    environment:
      <<: *purchase-environment
    ports:
      - "127.0.0.1:${PURCHASE_SERVICE_PORT:-8107}:8000"
    depends_on:
      purchase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sio-network

  # audit-outbox-worker (plantilla libs/sio-audit/compose/audit-outbox-worker.example.yaml):
  # misma imagen, configuración y base que la API; solo cambia el comando.
  purchase-audit-outbox-worker:
    image: sio/purchase-service:${SIO_SERVICES_VERSION}
    container_name: sio-purchase-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${PURCHASE_DB_USER}:${PURCHASE_DB_PASSWORD}@purchase-db:5432/${PURCHASE_DB_NAME}
      AUDIT_SERVICE_BASE_URL: http://audit-service:8000/api/v1
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      AUDIT_CLIENT_ID: purchase-service
      AUDIT_CLIENT_SECRET: ${PURCHASE_SERVICE_CLIENT_SECRET}
      AUDIT_OUTBOX_POLL_INTERVAL_SECONDS: ${AUDIT_OUTBOX_POLL_INTERVAL_SECONDS:-2}
      AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS: ${AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS:-5}
      AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS: ${AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS:-1}
      AUDIT_OUTBOX_BACKOFF_FACTOR: ${AUDIT_OUTBOX_BACKOFF_FACTOR:-2}
      AUDIT_OUTBOX_BACKOFF_MAX_SECONDS: ${AUDIT_OUTBOX_BACKOFF_MAX_SECONDS:-300}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      purchase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sio-network

  # Conciliador de operaciones PENDING (research.md R-08): misma imagen y
  # configuración que la API; consulta Inventory por clave.
  purchase-reconciler:
    image: sio/purchase-service:${SIO_SERVICES_VERSION}
    container_name: sio-purchase-reconciler
    command: ["python", "-m", "purchase_service.reconciler"]
    restart: unless-stopped
    environment:
      <<: *purchase-environment
    depends_on:
      purchase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "purchase_service.reconciler", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sio-network

volumes:
  purchase_db_data:
    name: sio-purchase-db-data

networks:
  sio-network:
    name: sio-network
    external: true
