name: sio-payment-reference-service

# Proyecto compose "sio-payment-reference-service": por ahora solo su base de datos propia;
# el contenedor de aplicación se agregará aquí cuando exista. Se une a
# "sio-network", creada por el proyecto "sio" (infrastructure/compose.yaml).

services:
  payment-reference-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-payment-reference-db
    environment:
      POSTGRES_DB: ${PAYMENT_REFERENCE_DB_NAME}
      POSTGRES_USER: ${PAYMENT_REFERENCE_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_REFERENCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PAYMENT_REFERENCE_DB_PORT}:5432"
    volumes:
      - payment_reference_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_REFERENCE_DB_USER} -d ${PAYMENT_REFERENCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  payment_reference_db_data:
    name: sio-payment-reference-db-data

networks:
  sio-network:
    name: sio-network
    external: true
