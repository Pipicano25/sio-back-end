name: party-identity-service

# Proyecto compose "party-identity-service" (única definición Compose del microservicio):
# base de datos propia, base de pruebas (perfil test) y contenedor de aplicación.
# La base y la aplicación se unen a "sio-network", creada por el proyecto
# "sio" (infrastructure/compose.yaml), que debe estar levantado antes: ahí
# viven Keycloak y RabbitMQ (depends_on no cruza proyectos; el orden lo
# garantiza infrastructure/scripts/rebuild-all.sh).

services:
  party-identity-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-party-identity-db
    environment:
      POSTGRES_DB: ${PARTY_IDENTITY_DB_NAME}
      POSTGRES_USER: ${PARTY_IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${PARTY_IDENTITY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PARTY_IDENTITY_DB_PORT}:5432"
    volumes:
      - party_identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARTY_IDENTITY_DB_USER} -d ${PARTY_IDENTITY_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Base de pruebas (perfil "test"): solo se levanta a pedido, desde la raíz:
  #   docker compose --file infrastructure/services/party-identity-service.yaml --env-file infrastructure/.env --profile test up -d party-identity-test-db
  # Datos en tmpfs (se pierden al detenerla). No usa sio-network: las pruebas
  # la alcanzan por el host (PARTY_IDENTITY_TEST_DATABASE_URL del .env del servicio).
  party-identity-test-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sio-party-identity-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${PARTY_IDENTITY_TEST_DB_NAME:-sio_party_identity_test}
      POSTGRES_USER: ${PARTY_IDENTITY_TEST_DB_USER:-sio_party_identity_test}
      POSTGRES_PASSWORD: ${PARTY_IDENTITY_TEST_DB_PASSWORD:-sio_party_identity_test_dev_change_me}
    ports:
      - "127.0.0.1:${PARTY_IDENTITY_TEST_DB_PORT:-55436}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  party-identity-service:
    build:
      context: ../..
      dockerfile: services/party-identity-service/Dockerfile
    image: sio/party-identity-service:${SIO_SERVICES_VERSION}
    container_name: sio-party-identity-service
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${PARTY_IDENTITY_DB_USER}:${PARTY_IDENTITY_DB_PASSWORD}@party-identity-db:5432/${PARTY_IDENTITY_DB_NAME}
      # Igual que product-catalog-service: el issuer debe coincidir con
      # KEYCLOAK_PUBLIC_URL y las llaves se obtienen dentro de sio-network.
      SIO_AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      SIO_AUTH_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      SIO_AUTH_AUDIENCE: sio-api
      SIO_DOCS_ENABLED: ${SIO_DOCS_ENABLED:-false}
      # Geography publica hoy sus rutas sin /api/v1; la URL incluye su prefijo.
      GEOGRAPHY_SERVICE_BASE_URL: http://geography-service:8000
      GEOGRAPHY_TIMEOUT_SECONDS: ${GEOGRAPHY_TIMEOUT_SECONDS:-5}
      # Operational Context: confirmación de perfiles de contacto (vía técnica).
      OPERATIONAL_CONTEXT_SERVICE_BASE_URL: ${OPERATIONAL_CONTEXT_SERVICE_BASE_URL:-http://operational-context-service:8000/api/v1}
      OPERATIONAL_CONTEXT_TIMEOUT_SECONDS: ${OPERATIONAL_CONTEXT_TIMEOUT_SECONDS:-5}
      # Identidad técnica: seed en modo Geography y consulta a Operational Context:
      #   docker compose exec party-identity-service python -m party_identity_service.seed load
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      KEYCLOAK_TIMEOUT_SECONDS: ${KEYCLOAK_TIMEOUT_SECONDS:-5}
      PARTY_IDENTITY_CLIENT_ID: party-identity-service
      PARTY_IDENTITY_CLIENT_SECRET: ${PARTY_IDENTITY_CLIENT_SECRET}

    ports:
      - "127.0.0.1:${PARTY_IDENTITY_SERVICE_PORT:-8101}:8000"

    depends_on:
      party-identity-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

    networks:
      - sio-network

  # audit-outbox-worker (feature 016; plantilla libs/sio-audit/compose/audit-outbox-worker.example.yaml):
  # misma imagen, configuración y base que la API; solo cambia el comando. Entrega la outbox de
  # auditoría a Audit con el cliente técnico party-identity-service.
  party-identity-audit-outbox-worker:
    image: sio/party-identity-service:${SIO_SERVICES_VERSION}
    container_name: sio-party-identity-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${PARTY_IDENTITY_DB_USER}:${PARTY_IDENTITY_DB_PASSWORD}@party-identity-db:5432/${PARTY_IDENTITY_DB_NAME}
      AUDIT_SERVICE_BASE_URL: http://audit-service:8000/api/v1
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      AUDIT_CLIENT_ID: party-identity-service
      AUDIT_CLIENT_SECRET: ${PARTY_IDENTITY_CLIENT_SECRET}
      AUDIT_OUTBOX_POLL_INTERVAL_SECONDS: ${AUDIT_OUTBOX_POLL_INTERVAL_SECONDS:-2}
      AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS: ${AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS:-5}
      AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS: ${AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS:-1}
      AUDIT_OUTBOX_BACKOFF_FACTOR: ${AUDIT_OUTBOX_BACKOFF_FACTOR:-2}
      AUDIT_OUTBOX_BACKOFF_MAX_SECONDS: ${AUDIT_OUTBOX_BACKOFF_MAX_SECONDS:-300}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      party-identity-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s
    networks:
      - sio-network

volumes:
  party_identity_db_data:
    name: sio-party-identity-db-data

networks:
  sio-network:
    name: sio-network
    external: true
