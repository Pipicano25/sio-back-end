name: audit-service

# Proyecto compose "audit-service" (única definición Compose del microservicio):
# base de datos propia, base de pruebas (perfil test) y contenedor de aplicación.
# La base y la aplicación se unen a "sio-network", creada por el proyecto
# "sio" (infrastructure/compose.yaml), que debe estar levantado antes: ahí vive Keycloak
# (depends_on no cruza proyectos; el orden lo garantiza infrastructure/scripts/rebuild-all.sh).

services:
  audit-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-audit-db
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME}
      POSTGRES_USER: ${AUDIT_DB_USER}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${AUDIT_DB_PORT}:5432"
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER} -d ${AUDIT_DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Base de pruebas (perfil "test"): solo se levanta a pedido, desde la raíz:
  #   docker compose --file infrastructure/services/audit-service.yaml --env-file infrastructure/.env --profile test up -d audit-test-db
  # Datos en tmpfs (se pierden al detenerla). No usa sio-network: las pruebas
  # la alcanzan por el host (AUDIT_TEST_DATABASE_URL del .env del servicio).
  # La usan también las pruebas de contrato de libs/sio-audit como base del "emisor".
  audit-test-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sio-audit-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${AUDIT_TEST_DB_NAME:-sio_audit_test}
      POSTGRES_USER: ${AUDIT_TEST_DB_USER:-sio_audit_test}
      POSTGRES_PASSWORD: ${AUDIT_TEST_DB_PASSWORD:-sio_audit_test_dev_change_me}
    ports:
      - "127.0.0.1:${AUDIT_TEST_DB_PORT:-55451}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  audit-service:
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    image: sio/audit-service:${SIO_SERVICES_VERSION}
    container_name: sio-audit-service
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${AUDIT_DB_USER}:${AUDIT_DB_PASSWORD}@audit-db:5432/${AUDIT_DB_NAME}
      # El issuer debe coincidir con KEYCLOAK_PUBLIC_URL; las llaves se
      # obtienen dentro de sio-network.
      SIO_AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      SIO_AUTH_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      SIO_AUTH_AUDIENCE: sio-api
      SIO_DOCS_ENABLED: ${SIO_DOCS_ENABLED:-false}
      # Membresía del usuario con su propio token (operational-access, vía propia; FR-050).
      # La URL incluye /api/v1 (specs/011-audit-core/contracts/operational-context-dependency.md).
      # Sin dependencia de arranque: si no está disponible, la consulta de empresa
      # responde 503 con dependency=operational-context; el registro no la usa.
      OPERATIONAL_CONTEXT_SERVICE_BASE_URL: http://operational-context-service:8000/api/v1
      OPERATIONAL_CONTEXT_TIMEOUT_SECONDS: ${OPERATIONAL_CONTEXT_TIMEOUT_SECONDS:-5}
      AUDIT_MAX_CLOCK_SKEW_SECONDS: ${AUDIT_MAX_CLOCK_SKEW_SECONDS:-300}

    ports:
      - "127.0.0.1:${AUDIT_SERVICE_PORT:-8110}:8000"

    depends_on:
      audit-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

    networks:
      - sio-network

volumes:
  audit_db_data:
    name: sio-audit-db-data

networks:
  sio-network:
    name: sio-network
    external: true
