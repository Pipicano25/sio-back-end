name: operational-context-service

# Proyecto compose "operational-context-service" (única definición Compose del microservicio):
# base de datos propia, base de pruebas (perfil test) y contenedor de aplicación.
# La base y la aplicación se unen a "sio-network", creada por el proyecto
# "sio" (infrastructure/compose.yaml), que debe estar levantado antes: ahí
# viven Keycloak y RabbitMQ (depends_on no cruza proyectos; el orden lo
# garantiza infrastructure/scripts/rebuild-all.sh).

services:
  operational-context-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-operational-context-db
    environment:
      POSTGRES_DB: ${OPERATIONAL_CONTEXT_DB_NAME}
      POSTGRES_USER: ${OPERATIONAL_CONTEXT_DB_USER}
      POSTGRES_PASSWORD: ${OPERATIONAL_CONTEXT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${OPERATIONAL_CONTEXT_DB_PORT}:5432"
    volumes:
      - operational_context_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPERATIONAL_CONTEXT_DB_USER} -d ${OPERATIONAL_CONTEXT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Base de pruebas (perfil "test"): solo se levanta a pedido, desde la raíz:
  #   docker compose --file infrastructure/services/operational-context-service.yaml --env-file infrastructure/.env --profile test up -d operational-context-test-db
  # Datos en tmpfs (se pierden al detenerla). No usa sio-network: las pruebas
  # la alcanzan por el host (OPERATIONAL_CONTEXT_TEST_DATABASE_URL del .env del servicio).
  operational-context-test-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sio-operational-context-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${OPERATIONAL_CONTEXT_TEST_DB_NAME:-sio_operational_context_test}
      POSTGRES_USER: ${OPERATIONAL_CONTEXT_TEST_DB_USER:-sio_operational_context_test}
      POSTGRES_PASSWORD: ${OPERATIONAL_CONTEXT_TEST_DB_PASSWORD:-sio_operational_context_test_dev_change_me}
    ports:
      - "127.0.0.1:${OPERATIONAL_CONTEXT_TEST_DB_PORT:-55440}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  operational-context-service:
    build:
      context: ../..
      dockerfile: services/operational-context-service/Dockerfile
    image: sio/operational-context-service:${SIO_SERVICES_VERSION}
    container_name: sio-operational-context-service
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${OPERATIONAL_CONTEXT_DB_USER}:${OPERATIONAL_CONTEXT_DB_PASSWORD}@operational-context-db:5432/${OPERATIONAL_CONTEXT_DB_NAME}
      # El issuer debe coincidir con KEYCLOAK_PUBLIC_URL; las llaves se
      # obtienen dentro de sio-network.
      SIO_AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      SIO_AUTH_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      SIO_AUTH_AUDIENCE: sio-api
      SIO_DOCS_ENABLED: ${SIO_DOCS_ENABLED:-false}
      # La URL de Party Identity incluye /api/v1; la de Geography, su prefijo
      # vigente (hoy sin /api/v1). Ver specs/004-operational-context-core/contracts/.
      PARTY_IDENTITY_SERVICE_BASE_URL: ${PARTY_IDENTITY_SERVICE_BASE_URL:-http://party-identity-service:8000/api/v1}
      PARTY_IDENTITY_TIMEOUT_SECONDS: ${PARTY_IDENTITY_TIMEOUT_SECONDS:-5}
      GEOGRAPHY_SERVICE_BASE_URL: http://geography-service:8000
      GEOGRAPHY_TIMEOUT_SECONDS: ${GEOGRAPHY_TIMEOUT_SECONDS:-5}
      # Admin API de Keycloak de solo lectura con el cliente técnico propio
      # (specs/005-operational-context-users/contracts/keycloak-dependency.md).
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      OPERATIONAL_CONTEXT_CLIENT_ID: operational-context-service
      OPERATIONAL_CONTEXT_CLIENT_SECRET: ${OPERATIONAL_CONTEXT_CLIENT_SECRET}
      KEYCLOAK_TIMEOUT_SECONDS: ${KEYCLOAK_TIMEOUT_SECONDS:-5}
      SIO_API_CLIENT_ID: sio-api

    ports:
      - "127.0.0.1:${OPERATIONAL_CONTEXT_SERVICE_PORT:-8104}:8000"

    depends_on:
      operational-context-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - sio-network

  # audit-outbox-worker (feature 016; plantilla libs/sio-audit/compose/audit-outbox-worker.example.yaml):
  # misma imagen, configuración y base que la API; solo cambia el comando. Entrega la outbox de
  # auditoría a Audit con el cliente técnico operational-context-service.
  operational-context-audit-outbox-worker:
    image: sio/operational-context-service:${SIO_SERVICES_VERSION}
    container_name: sio-operational-context-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${OPERATIONAL_CONTEXT_DB_USER}:${OPERATIONAL_CONTEXT_DB_PASSWORD}@operational-context-db:5432/${OPERATIONAL_CONTEXT_DB_NAME}
      AUDIT_SERVICE_BASE_URL: http://audit-service:8000/api/v1
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      AUDIT_CLIENT_ID: operational-context-service
      AUDIT_CLIENT_SECRET: ${OPERATIONAL_CONTEXT_CLIENT_SECRET}
      AUDIT_OUTBOX_POLL_INTERVAL_SECONDS: ${AUDIT_OUTBOX_POLL_INTERVAL_SECONDS:-2}
      AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS: ${AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS:-5}
      AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS: ${AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS:-1}
      AUDIT_OUTBOX_BACKOFF_FACTOR: ${AUDIT_OUTBOX_BACKOFF_FACTOR:-2}
      AUDIT_OUTBOX_BACKOFF_MAX_SECONDS: ${AUDIT_OUTBOX_BACKOFF_MAX_SECONDS:-300}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      operational-context-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
    networks:
      - sio-network

volumes:
  operational_context_db_data:
    name: sio-operational-context-db-data

networks:
  sio-network:
    name: sio-network
    external: true
