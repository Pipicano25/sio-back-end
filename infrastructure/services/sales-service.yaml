name: sio-sales-service

# Proyecto compose "sio-sales-service": por ahora solo su base de datos propia;
# el contenedor de aplicación se agregará aquí cuando exista. Se une a
# "sio-network", creada por el proyecto "sio" (infrastructure/compose.yaml).

services:
  sales-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-sales-db
    environment:
      POSTGRES_DB: ${SALES_DB_NAME}
      POSTGRES_USER: ${SALES_DB_USER}
      POSTGRES_PASSWORD: ${SALES_DB_PASSWORD}
    ports:
      - "127.0.0.1:${SALES_DB_PORT}:5432"
    volumes:
      - sales_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SALES_DB_USER} -d ${SALES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sales_db_data:
    name: sio-sales-db-data

networks:
  sio-network:
    name: sio-network
    external: true
