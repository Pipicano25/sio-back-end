name: inventory-service

# Proyecto compose "inventory-service" (única definición Compose del microservicio):
# base de datos propia, base de pruebas (perfil test), contenedor de aplicación y
# audit-outbox-worker (misma imagen; libs/sio-audit). La base, la aplicación y el
# worker se unen a "sio-network", creada por el proyecto "sio"
# (infrastructure/compose.yaml), que debe estar levantado antes: ahí vive Keycloak
# (depends_on no cruza proyectos; el orden lo garantiza infrastructure/scripts/rebuild-all.sh).

services:
  inventory-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${INVENTORY_DB_PORT}:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Base de pruebas (perfil "test"): solo se levanta a pedido, desde la raíz:
  #   docker compose --file infrastructure/services/inventory-service.yaml --env-file infrastructure/.env --profile test up -d inventory-test-db
  # Datos en tmpfs (se pierden al detenerla). No usa sio-network: las pruebas
  # la alcanzan por el host (INVENTORY_TEST_DATABASE_URL del .env del servicio).
  inventory-test-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sio-inventory-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${INVENTORY_TEST_DB_NAME:-sio_inventory_test}
      POSTGRES_USER: ${INVENTORY_TEST_DB_USER:-sio_inventory_test}
      POSTGRES_PASSWORD: ${INVENTORY_TEST_DB_PASSWORD:-sio_inventory_test_dev_change_me}
    ports:
      - "127.0.0.1:${INVENTORY_TEST_DB_PORT:-55449}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  inventory-service:
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    image: sio/inventory-service:${SIO_SERVICES_VERSION}
    container_name: sio-inventory-service
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory-db:5432/${INVENTORY_DB_NAME}
      # El issuer debe coincidir con KEYCLOAK_PUBLIC_URL; las llaves se
      # obtienen dentro de sio-network.
      SIO_AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      SIO_AUTH_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      SIO_AUTH_AUDIENCE: sio-api
      SIO_DOCS_ENABLED: ${SIO_DOCS_ENABLED:-false}
      # Dependencias (specs/012-inventory-core/contracts/dependencies.md). Las URL
      # incluyen /api/v1. Sin dependencia de arranque: si no están disponibles, las
      # operaciones responden 503 con la dependencia y no aplican nada.
      OPERATIONAL_CONTEXT_SERVICE_BASE_URL: http://operational-context-service:8000/api/v1
      OPERATIONAL_CONTEXT_TIMEOUT_SECONDS: ${OPERATIONAL_CONTEXT_TIMEOUT_SECONDS:-5}
      COMMERCIAL_RELATIONSHIP_SERVICE_BASE_URL: http://commercial-relationship-service:8000/api/v1
      COMMERCIAL_RELATIONSHIP_TIMEOUT_SECONDS: ${COMMERCIAL_RELATIONSHIP_TIMEOUT_SECONDS:-5}
      INVENTORY_LOCK_TIMEOUT_SECONDS: ${INVENTORY_LOCK_TIMEOUT_SECONDS:-5}
      # Identidad técnica propia (client_credentials, D5).
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      INVENTORY_CLIENT_ID: inventory-service
      INVENTORY_CLIENT_SECRET: ${INVENTORY_SERVICE_CLIENT_SECRET}

    ports:
      - "127.0.0.1:${INVENTORY_SERVICE_PORT:-8109}:8000"

    depends_on:
      inventory-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - sio-network

  # audit-outbox-worker (FR-072; plantilla libs/sio-audit/compose/audit-outbox-worker.example.yaml):
  # misma imagen, configuración y base que la API; solo cambia el comando.
  inventory-audit-outbox-worker:
    image: sio/inventory-service:${SIO_SERVICES_VERSION}
    container_name: sio-inventory-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${INVENTORY_DB_USER}:${INVENTORY_DB_PASSWORD}@inventory-db:5432/${INVENTORY_DB_NAME}
      AUDIT_SERVICE_BASE_URL: http://audit-service:8000/api/v1
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      AUDIT_CLIENT_ID: inventory-service
      AUDIT_CLIENT_SECRET: ${INVENTORY_SERVICE_CLIENT_SECRET}
      AUDIT_OUTBOX_POLL_INTERVAL_SECONDS: ${AUDIT_OUTBOX_POLL_INTERVAL_SECONDS:-2}
      AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS: ${AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS:-5}
      AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS: ${AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS:-1}
      AUDIT_OUTBOX_BACKOFF_FACTOR: ${AUDIT_OUTBOX_BACKOFF_FACTOR:-2}
      AUDIT_OUTBOX_BACKOFF_MAX_SECONDS: ${AUDIT_OUTBOX_BACKOFF_MAX_SECONDS:-300}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sio-network

volumes:
  inventory_db_data:
    name: sio-inventory-db-data

networks:
  sio-network:
    name: sio-network
    external: true
