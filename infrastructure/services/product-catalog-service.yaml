name: product-catalog-service

# Proyecto compose "product-catalog-service" (única definición Compose del microservicio):
# base de datos propia, base de pruebas (perfil test) y contenedor de aplicación.
# La base y la aplicación se unen a "sio-network", creada por el proyecto
# "sio" (infrastructure/compose.yaml), que debe estar levantado antes: ahí
# viven Keycloak y RabbitMQ (depends_on no cruza proyectos; el orden lo
# garantiza infrastructure/scripts/rebuild-all.sh).

services:
  product-catalog-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-product-catalog-db
    environment:
      POSTGRES_DB: ${PRODUCT_CATALOG_DB_NAME}
      POSTGRES_USER: ${PRODUCT_CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_CATALOG_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PRODUCT_CATALOG_DB_PORT}:5432"
    volumes:
      - product_catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_CATALOG_DB_USER} -d ${PRODUCT_CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Base de pruebas (perfil "test"): solo se levanta a pedido, desde la raíz:
  #   docker compose --file infrastructure/services/product-catalog-service.yaml --env-file infrastructure/.env --profile test up -d product-catalog-test-db
  # Datos en tmpfs (se pierden al detenerla). No usa sio-network: las pruebas
  # la alcanzan por el host (PRODUCT_CATALOG_TEST_DATABASE_URL del .env del servicio).
  product-catalog-test-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sio-product-catalog-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${PRODUCT_CATALOG_TEST_DB_NAME:-sio_product_catalog_test}
      POSTGRES_USER: ${PRODUCT_CATALOG_TEST_DB_USER:-sio_product_catalog_test}
      POSTGRES_PASSWORD: ${PRODUCT_CATALOG_TEST_DB_PASSWORD:-sio_product_catalog_test_dev_change_me}
    ports:
      - "127.0.0.1:${PRODUCT_CATALOG_TEST_DB_PORT:-55438}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  product-catalog-service:
    build:
      context: ../..
      dockerfile: services/product-catalog-service/Dockerfile
    image: sio/product-catalog-service:${SIO_SERVICES_VERSION}
    container_name: sio-product-catalog-service
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${PRODUCT_CATALOG_DB_USER}:${PRODUCT_CATALOG_DB_PASSWORD}@product-catalog-db:5432/${PRODUCT_CATALOG_DB_NAME}
      # Igual que geography-service: el issuer debe coincidir con
      # KEYCLOAK_PUBLIC_URL y las llaves se obtienen dentro de sio-network.
      # product-catalog-service usa los nombres de variable de sio-auth.
      SIO_AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      SIO_AUTH_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      SIO_AUTH_AUDIENCE: sio-api
      SIO_DOCS_ENABLED: ${SIO_DOCS_ENABLED:-false}
      # La URL incluye el prefijo de ruta de Party Identity (/api/v1) y es
      # configurable (contracts/party-identity-dependency.md).
      PARTY_IDENTITY_SERVICE_BASE_URL: ${PARTY_IDENTITY_SERVICE_BASE_URL:-http://party-identity-service:8000/api/v1}
      PARTY_IDENTITY_TIMEOUT_SECONDS: ${PARTY_IDENTITY_TIMEOUT_SECONDS:-3}

    ports:
      - "127.0.0.1:${PRODUCT_CATALOG_SERVICE_PORT:-8103}:8000"

    depends_on:
      product-catalog-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - sio-network

  # audit-outbox-worker (feature 016; plantilla libs/sio-audit/compose/audit-outbox-worker.example.yaml):
  # misma imagen, configuración y base que la API; solo cambia el comando. Entrega la outbox de
  # auditoría a Audit con el cliente técnico product-catalog-service.
  product-catalog-audit-outbox-worker:
    image: sio/product-catalog-service:${SIO_SERVICES_VERSION}
    container_name: sio-product-catalog-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${PRODUCT_CATALOG_DB_USER}:${PRODUCT_CATALOG_DB_PASSWORD}@product-catalog-db:5432/${PRODUCT_CATALOG_DB_NAME}
      AUDIT_SERVICE_BASE_URL: http://audit-service:8000/api/v1
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      AUDIT_CLIENT_ID: product-catalog-service
      AUDIT_CLIENT_SECRET: ${PRODUCT_CATALOG_SERVICE_CLIENT_SECRET}
      AUDIT_OUTBOX_POLL_INTERVAL_SECONDS: ${AUDIT_OUTBOX_POLL_INTERVAL_SECONDS:-2}
      AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS: ${AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS:-5}
      AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS: ${AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS:-1}
      AUDIT_OUTBOX_BACKOFF_FACTOR: ${AUDIT_OUTBOX_BACKOFF_FACTOR:-2}
      AUDIT_OUTBOX_BACKOFF_MAX_SECONDS: ${AUDIT_OUTBOX_BACKOFF_MAX_SECONDS:-300}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      product-catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
    networks:
      - sio-network

volumes:
  product_catalog_db_data:
    name: sio-product-catalog-db-data

networks:
  sio-network:
    name: sio-network
    external: true
