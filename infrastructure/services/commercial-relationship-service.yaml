name: commercial-relationship-service

# Proyecto compose "commercial-relationship-service" (única definición Compose del microservicio):
# base de datos propia, base de pruebas (perfil test) y contenedor de aplicación.
# La base y la aplicación se unen a "sio-network", creada por el proyecto
# "sio" (infrastructure/compose.yaml), que debe estar levantado antes: ahí vive Keycloak
# (depends_on no cruza proyectos; el orden lo garantiza infrastructure/scripts/rebuild-all.sh).

services:
  commercial-relationship-db:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    networks:
      - sio-network
    container_name: sio-commercial-relationship-db
    environment:
      POSTGRES_DB: ${COMMERCIAL_RELATIONSHIP_DB_NAME}
      POSTGRES_USER: ${COMMERCIAL_RELATIONSHIP_DB_USER}
      POSTGRES_PASSWORD: ${COMMERCIAL_RELATIONSHIP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${COMMERCIAL_RELATIONSHIP_DB_PORT}:5432"
    volumes:
      - commercial_relationship_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMMERCIAL_RELATIONSHIP_DB_USER} -d ${COMMERCIAL_RELATIONSHIP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Base de pruebas (perfil "test"): solo se levanta a pedido, desde la raíz:
  #   docker compose --file infrastructure/services/commercial-relationship-service.yaml --env-file infrastructure/.env --profile test up -d commercial-relationship-test-db
  # Datos en tmpfs (se pierden al detenerla). No usa sio-network: las pruebas
  # la alcanzan por el host (COMMERCIAL_RELATIONSHIP_TEST_DATABASE_URL del .env del servicio).
  commercial-relationship-test-db:
    image: postgres:${POSTGRES_VERSION}
    container_name: sio-commercial-relationship-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${COMMERCIAL_RELATIONSHIP_TEST_DB_NAME:-sio_commercial_relationship_test}
      POSTGRES_USER: ${COMMERCIAL_RELATIONSHIP_TEST_DB_USER:-sio_commercial_relationship_test}
      POSTGRES_PASSWORD: ${COMMERCIAL_RELATIONSHIP_TEST_DB_PASSWORD:-sio_commercial_relationship_test_dev_change_me}
    ports:
      - "127.0.0.1:${COMMERCIAL_RELATIONSHIP_TEST_DB_PORT:-55443}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  commercial-relationship-service:
    build:
      context: ../..
      dockerfile: services/commercial-relationship-service/Dockerfile
    image: sio/commercial-relationship-service:${SIO_SERVICES_VERSION}
    container_name: sio-commercial-relationship-service
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${COMMERCIAL_RELATIONSHIP_DB_USER}:${COMMERCIAL_RELATIONSHIP_DB_PASSWORD}@commercial-relationship-db:5432/${COMMERCIAL_RELATIONSHIP_DB_NAME}
      # El issuer debe coincidir con KEYCLOAK_PUBLIC_URL; las llaves se
      # obtienen dentro de sio-network.
      SIO_AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      SIO_AUTH_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      SIO_AUTH_AUDIENCE: sio-api
      SIO_DOCS_ENABLED: ${SIO_DOCS_ENABLED:-false}
      # Las URL de los proveedores incluyen /api/v1
      # (specs/007-commercial-relationship-core/contracts/*-dependency.md).
      OPERATIONAL_CONTEXT_SERVICE_BASE_URL: http://operational-context-service:8000/api/v1
      OPERATIONAL_CONTEXT_TIMEOUT_SECONDS: ${OPERATIONAL_CONTEXT_TIMEOUT_SECONDS:-5}
      PRODUCT_CATALOG_SERVICE_BASE_URL: http://product-catalog-service:8000/api/v1
      PRODUCT_CATALOG_TIMEOUT_SECONDS: ${PRODUCT_CATALOG_TIMEOUT_SECONDS:-5}
      PARTY_IDENTITY_SERVICE_BASE_URL: http://party-identity-service:8000/api/v1
      PARTY_IDENTITY_TIMEOUT_SECONDS: ${PARTY_IDENTITY_TIMEOUT_SECONDS:-5}
      # Payment Reference sin /api/v1 (GAP-PR-14 diferido; C-06 de la feature 010).
      # Sin dependencia de arranque: si no está disponible, las rutas que lo usan
      # responden 503 con dependency=payment-reference.
      PAYMENT_REFERENCE_SERVICE_BASE_URL: http://payment-reference-service:8000
      PAYMENT_REFERENCE_TIMEOUT_SECONDS: ${PAYMENT_REFERENCE_TIMEOUT_SECONDS:-5}
      # Identidad técnica propia (client_credentials) hacia Product Catalog y Payment Reference.
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      COMMERCIAL_RELATIONSHIP_CLIENT_ID: commercial-relationship-service
      COMMERCIAL_RELATIONSHIP_CLIENT_SECRET: ${COMMERCIAL_RELATIONSHIP_CLIENT_SECRET}
      KEYCLOAK_TIMEOUT_SECONDS: ${KEYCLOAK_TIMEOUT_SECONDS:-5}

    ports:
      - "127.0.0.1:${COMMERCIAL_RELATIONSHIP_SERVICE_PORT:-8106}:8000"

    depends_on:
      commercial-relationship-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - sio-network

  # audit-outbox-worker (feature 016; plantilla libs/sio-audit/compose/audit-outbox-worker.example.yaml):
  # misma imagen, configuración y base que la API; solo cambia el comando. Entrega la outbox de
  # auditoría a Audit con el cliente técnico commercial-relationship-service.
  commercial-relationship-audit-outbox-worker:
    image: sio/commercial-relationship-service:${SIO_SERVICES_VERSION}
    container_name: sio-commercial-relationship-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${COMMERCIAL_RELATIONSHIP_DB_USER}:${COMMERCIAL_RELATIONSHIP_DB_PASSWORD}@commercial-relationship-db:5432/${COMMERCIAL_RELATIONSHIP_DB_NAME}
      AUDIT_SERVICE_BASE_URL: http://audit-service:8000/api/v1
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      AUDIT_CLIENT_ID: commercial-relationship-service
      AUDIT_CLIENT_SECRET: ${COMMERCIAL_RELATIONSHIP_CLIENT_SECRET}
      AUDIT_OUTBOX_POLL_INTERVAL_SECONDS: ${AUDIT_OUTBOX_POLL_INTERVAL_SECONDS:-2}
      AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS: ${AUDIT_OUTBOX_HTTP_TIMEOUT_SECONDS:-5}
      AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS: ${AUDIT_OUTBOX_BACKOFF_INITIAL_SECONDS:-1}
      AUDIT_OUTBOX_BACKOFF_FACTOR: ${AUDIT_OUTBOX_BACKOFF_FACTOR:-2}
      AUDIT_OUTBOX_BACKOFF_MAX_SECONDS: ${AUDIT_OUTBOX_BACKOFF_MAX_SECONDS:-300}
      AUDIT_OUTBOX_BATCH_SIZE: ${AUDIT_OUTBOX_BATCH_SIZE:-100}
    depends_on:
      commercial-relationship-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s
    networks:
      - sio-network

  # Worker de precios automáticos (spec 021): misma imagen y base que la API; procesa las
  # aplicaciones por lista y presentación en orden de secuencia. Solo usa su base (sin HTTP ni
  # credenciales técnicas); registra updated_by = system:commercial-relationship-price-worker.
  commercial-relationship-price-worker:
    image: sio/commercial-relationship-service:${SIO_SERVICES_VERSION}
    container_name: sio-commercial-relationship-price-worker
    command: ["python", "-m", "commercial_relationship_service.price_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${COMMERCIAL_RELATIONSHIP_DB_USER}:${COMMERCIAL_RELATIONSHIP_DB_PASSWORD}@commercial-relationship-db:5432/${COMMERCIAL_RELATIONSHIP_DB_NAME}
      CR_PRICE_WORKER_INTERVAL_SECONDS: ${CR_PRICE_WORKER_INTERVAL_SECONDS:-5}
      CR_PRICE_WORKER_BATCH_SIZE: ${CR_PRICE_WORKER_BATCH_SIZE:-50}
      CR_PRICE_WORKER_MAX_BACKOFF_SECONDS: ${CR_PRICE_WORKER_MAX_BACKOFF_SECONDS:-300}
    depends_on:
      commercial-relationship-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "commercial_relationship_service.price_worker", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sio-network

volumes:
  commercial_relationship_db_data:
    name: sio-commercial-relationship-db-data

networks:
  sio-network:
    name: sio-network
    external: true
