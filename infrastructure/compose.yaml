name: sio

# Proyecto compose "sio": solo la infraestructura compartida (Keycloak, su
# base y RabbitMQ). Cada microservicio vive en su propio proyecto compose
# (services/<microservicio>.yaml, proyecto "<microservicio>") con su base, su base
# de pruebas y su contenedor de aplicación; todos se unen a la red "sio-network" que crea
# este proyecto, por lo que este debe levantarse primero.

x-postgres-base: &postgres-base
  image: postgres:${POSTGRES_VERSION}
  restart: unless-stopped
  networks:
    - sio-network

services:
  # --- Identidad ---

  keycloak-db:
    <<: *postgres-base
    container_name: sio-keycloak-db

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "127.0.0.1:${KEYCLOAK_DB_PORT}:5432"

    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Containerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION}

    image: sio/keycloak:${KEYCLOAK_VERSION}
    container_name: sio-keycloak
    restart: unless-stopped
    init: true

    command:
      - start
      - --optimized
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      SIO_WEB_ORIGIN: ${SIO_WEB_ORIGIN}
      SIO_WEB_REDIRECT_URI: ${SIO_WEB_REDIRECT_URI}

      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD}
      # Secretos de los clientes técnicos referenciados en la plantilla del realm.
      PARTY_IDENTITY_CLIENT_SECRET: ${PARTY_IDENTITY_CLIENT_SECRET}
      OPERATIONAL_CONTEXT_CLIENT_SECRET: ${OPERATIONAL_CONTEXT_CLIENT_SECRET}
      COMMERCIAL_RELATIONSHIP_CLIENT_SECRET: ${COMMERCIAL_RELATIONSHIP_CLIENT_SECRET}
      AUDIT_TEST_EMITTER_CLIENT_SECRET: ${AUDIT_TEST_EMITTER_CLIENT_SECRET}
      INVENTORY_SERVICE_CLIENT_SECRET: ${INVENTORY_SERVICE_CLIENT_SECRET}
      INVENTORY_TEST_OPERATOR_CLIENT_SECRET: ${INVENTORY_TEST_OPERATOR_CLIENT_SECRET}
      SIO_DATA_IMPORTER_CLIENT_SECRET: ${SIO_DATA_IMPORTER_CLIENT_SECRET}
      PURCHASE_SERVICE_CLIENT_SECRET: ${PURCHASE_SERVICE_CLIENT_SECRET}
      SALES_SERVICE_CLIENT_SECRET: ${SALES_SERVICE_CLIENT_SECRET}
      PRODUCT_CATALOG_SERVICE_CLIENT_SECRET: ${PRODUCT_CATALOG_SERVICE_CLIENT_SECRET}
      PRODUCT_INVENTORY_QUERY_SERVICE_CLIENT_SECRET: ${PRODUCT_INVENTORY_QUERY_SERVICE_CLIENT_SECRET}

    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT}:9000"

    volumes:
      - ./keycloak/realm-template/sio-realm.template.json:/opt/keycloak/data/import/sio-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro

    depends_on:
      keycloak-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

    networks:
      - sio-network

  # --- Mensajería ---

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: sio-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - sio_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - sio-network

volumes:
  keycloak_db_data:
    name: sio-keycloak-db-data

  sio_rabbitmq_data:
    name: sio-rabbitmq-data

networks:
  sio-network:
    name: sio-network
    driver: bridge
