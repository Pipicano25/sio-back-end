name: sio

x-postgres-base: &postgres-base
  image: postgres:${POSTGRES_VERSION}
  restart: unless-stopped
  networks:
    - sio-network

services:
  # --- Bases de datos independientes por microservicio ---
  # Cada microservicio tiene su propia instancia Postgres, su propio
  # usuario/rol y su propio volumen. Ningún microservicio comparte
  # instancia de base de datos con otro.

  operational-context-db:
    <<: *postgres-base
    container_name: sio-operational-context-db
    environment:
      POSTGRES_DB: ${OPERATIONAL_CONTEXT_DB_NAME}
      POSTGRES_USER: ${OPERATIONAL_CONTEXT_DB_USER}
      POSTGRES_PASSWORD: ${OPERATIONAL_CONTEXT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${OPERATIONAL_CONTEXT_DB_PORT}:5432"
    volumes:
      - operational_context_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPERATIONAL_CONTEXT_DB_USER} -d ${OPERATIONAL_CONTEXT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  party-identity-db:
    <<: *postgres-base
    container_name: sio-party-identity-db
    environment:
      POSTGRES_DB: ${PARTY_IDENTITY_DB_NAME}
      POSTGRES_USER: ${PARTY_IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${PARTY_IDENTITY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PARTY_IDENTITY_DB_PORT}:5432"
    volumes:
      - party_identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARTY_IDENTITY_DB_USER} -d ${PARTY_IDENTITY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  geography-db:
    <<: *postgres-base
    container_name: sio-geography-db
    environment:
      POSTGRES_DB: ${GEOGRAPHY_DB_NAME}
      POSTGRES_USER: ${GEOGRAPHY_DB_USER}
      POSTGRES_PASSWORD: ${GEOGRAPHY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${GEOGRAPHY_DB_PORT}:5432"
    volumes:
      - geography_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GEOGRAPHY_DB_USER} -d ${GEOGRAPHY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  payment-reference-db:
    <<: *postgres-base
    container_name: sio-payment-reference-db
    environment:
      POSTGRES_DB: ${PAYMENT_REFERENCE_DB_NAME}
      POSTGRES_USER: ${PAYMENT_REFERENCE_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_REFERENCE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PAYMENT_REFERENCE_DB_PORT}:5432"
    volumes:
      - payment_reference_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_REFERENCE_DB_USER} -d ${PAYMENT_REFERENCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  product-catalog-db:
    <<: *postgres-base
    container_name: sio-product-catalog-db
    environment:
      POSTGRES_DB: ${PRODUCT_CATALOG_DB_NAME}
      POSTGRES_USER: ${PRODUCT_CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_CATALOG_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PRODUCT_CATALOG_DB_PORT}:5432"
    volumes:
      - product_catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCT_CATALOG_DB_USER} -d ${PRODUCT_CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  commercial-relationship-db:
    <<: *postgres-base
    container_name: sio-commercial-relationship-db
    environment:
      POSTGRES_DB: ${COMMERCIAL_RELATIONSHIP_DB_NAME}
      POSTGRES_USER: ${COMMERCIAL_RELATIONSHIP_DB_USER}
      POSTGRES_PASSWORD: ${COMMERCIAL_RELATIONSHIP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${COMMERCIAL_RELATIONSHIP_DB_PORT}:5432"
    volumes:
      - commercial_relationship_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMMERCIAL_RELATIONSHIP_DB_USER} -d ${COMMERCIAL_RELATIONSHIP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  purchase-db:
    <<: *postgres-base
    container_name: sio-purchase-db
    environment:
      POSTGRES_DB: ${PURCHASE_DB_NAME}
      POSTGRES_USER: ${PURCHASE_DB_USER}
      POSTGRES_PASSWORD: ${PURCHASE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${PURCHASE_DB_PORT}:5432"
    volumes:
      - purchase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PURCHASE_DB_USER} -d ${PURCHASE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  sales-db:
    <<: *postgres-base
    container_name: sio-sales-db
    environment:
      POSTGRES_DB: ${SALES_DB_NAME}
      POSTGRES_USER: ${SALES_DB_USER}
      POSTGRES_PASSWORD: ${SALES_DB_PASSWORD}
    ports:
      - "127.0.0.1:${SALES_DB_PORT}:5432"
    volumes:
      - sales_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SALES_DB_USER} -d ${SALES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  inventory-db:
    <<: *postgres-base
    container_name: sio-inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME}
      POSTGRES_USER: ${INVENTORY_DB_USER}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD}
    ports:
      - "127.0.0.1:${INVENTORY_DB_PORT}:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER} -d ${INVENTORY_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  audit-db:
    <<: *postgres-base
    container_name: sio-audit-db
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME}
      POSTGRES_USER: ${AUDIT_DB_USER}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
    ports:
      - "127.0.0.1:${AUDIT_DB_PORT}:5432"
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER} -d ${AUDIT_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  workflow-db:
    <<: *postgres-base
    container_name: sio-workflow-db
    environment:
      POSTGRES_DB: ${WORKFLOW_DB_NAME}
      POSTGRES_USER: ${WORKFLOW_DB_USER}
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD}
    ports:
      - "127.0.0.1:${WORKFLOW_DB_PORT}:5432"
    volumes:
      - workflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WORKFLOW_DB_USER} -d ${WORKFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Identidad ---

  keycloak-db:
    <<: *postgres-base
    container_name: sio-keycloak-db

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "127.0.0.1:${KEYCLOAK_DB_PORT}:5432"

    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Containerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION}

    image: sio/keycloak:${KEYCLOAK_VERSION}
    container_name: sio-keycloak
    restart: unless-stopped
    init: true

    command:
      - start
      - --optimized
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      SIO_WEB_ORIGIN: ${SIO_WEB_ORIGIN}
      SIO_WEB_REDIRECT_URI: ${SIO_WEB_REDIRECT_URI}

      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD}

    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT}:9000"

    volumes:
      - ./keycloak/realm-template/sio-realm.template.json:/opt/keycloak/data/import/sio-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro

    depends_on:
      keycloak-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

    networks:
      - sio-network

  # --- Mensajería ---

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION}
    container_name: sio-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - sio_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - sio-network

  # --- Aplicaciones (microservicios) ---
  # Cada microservicio construye su propia imagen desde su propio
  # Dockerfile (constitución §1) — nunca comparte contenedor ni imagen con
  # otro. El contexto de build es la raíz del monorepo (no
  # services/<nombre>/) porque cada microservicio depende de
  # libs/sio-auth como dependencia de path local.

  geography-service:
    build:
      context: ..
      dockerfile: services/geography-service/Dockerfile
    image: sio/geography-service:${SIO_SERVICES_VERSION}
    container_name: sio-geography-service
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${GEOGRAPHY_DB_USER}:${GEOGRAPHY_DB_PASSWORD}@geography-db:5432/${GEOGRAPHY_DB_NAME}
      # KC_HOSTNAME determina el claim `iss` de todo token emitido, sin
      # importar por qué red se alcanzó Keycloak: debe coincidir
      # exactamente con KEYCLOAK_PUBLIC_URL. KEYCLOAK_JWKS_URL, en
      # cambio, es la ruta real que este contenedor usa para *obtener*
      # las llaves públicas, y debe resolverse dentro de `sio-network`
      # (el contenedor no tiene acceso a "localhost" del host) — por eso
      # difiere del host:puerto expuesto en KEYCLOAK_PUBLIC_URL.
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: sio-api

    ports:
      - "127.0.0.1:${GEOGRAPHY_SERVICE_PORT}:8000"

    depends_on:
      geography-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - sio-network

volumes:
  operational_context_db_data:
    name: sio-operational-context-db-data
  party_identity_db_data:
    name: sio-party-identity-db-data
  geography_db_data:
    name: sio-geography-db-data
  payment_reference_db_data:
    name: sio-payment-reference-db-data
  product_catalog_db_data:
    name: sio-product-catalog-db-data
  commercial_relationship_db_data:
    name: sio-commercial-relationship-db-data
  purchase_db_data:
    name: sio-purchase-db-data
  sales_db_data:
    name: sio-sales-db-data
  inventory_db_data:
    name: sio-inventory-db-data
  audit_db_data:
    name: sio-audit-db-data
  workflow_db_data:
    name: sio-workflow-db-data

  keycloak_db_data:
    name: sio-keycloak-db-data

  sio_rabbitmq_data:
    name: sio-rabbitmq-data

networks:
  sio-network:
    name: sio-network
    driver: bridge
