[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sio-audit"
version = "0.1.0"
description = "Librería compartida de auditoría de SIO: contrato del evento, política única de redacción, outbox transaccional y audit-outbox-worker."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "SIO" }
]
dependencies = [
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
alembic = [
  "alembic>=1.14,<2",
]
test = [
  "pytest>=8.3,<9",
  "alembic>=1.14,<2",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sio_audit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: pruebas contra audit-service y Keycloak reales (R-16, SC-010)",
]
