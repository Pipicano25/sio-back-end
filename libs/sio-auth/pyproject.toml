[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sio-auth"
version = "0.3.0"
description = "Librería compartida de autenticación y autorización por permisos para los microservicios FastAPI de SIO."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "SIO" }
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.8,<3",
  "pytest>=8.0.0",
  "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sio_auth = ["py.typed"]
