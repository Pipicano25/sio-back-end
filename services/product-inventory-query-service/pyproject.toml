[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "product-inventory-query-service"
version = "0.1.0"
description = "Microservicio de solo lectura de SIO: consultas consolidadas de productos, inventario, bajo stock y resumen, compuestas por HTTP desde Commercial Relationship, Product Catalog, Inventory y Operational Context (spec 022)."
requires-python = ">=3.12"

# Sin base de datos ni escrituras (spec 022, A-02): no usa SQLAlchemy, Alembic ni sio-audit.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",

    # sio-auth >= 0.4.0 (403 sin revelar el permiso). Con referencias locales file: la versión
    # mínima no se expresa en la cadena PEP 508; verificarla contra libs/sio-auth/pyproject.toml.
    "sio-auth @ file:../../libs/sio-auth",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "PyJWT[crypto]>=2.8,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -m 'not integration and not performance'"
markers = [
    "integration: pruebas contra la pila aislada sio-it-* (SIO_TEST_TARGET=isolated y validation/isolation_guard.py)",
    "performance: pruebas de rendimiento, solo en la pila aislada (RNF-022-7)",
]

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["src/product_inventory_query_service"]
