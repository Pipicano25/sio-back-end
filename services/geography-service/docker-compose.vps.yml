name: geography-service-vps

# Despliegue de geography-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/geography-service.yaml):
# - Proyecto "geography-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "geography-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (geography-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8102 (docs/port-map.md), publicado solo en 127.0.0.1: el acceso público
#   pasa por el proxy inverso de la VPS.
#
# Desde la raíz del repositorio:
#   docker compose -f services/geography-service/docker-compose.vps.yml --env-file services/geography-service/.env.vps build
#   docker compose -f services/geography-service/docker-compose.vps.yml --env-file services/geography-service/.env.vps up -d

x-geography-vps: &geography-vps
  image: sio/geography-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  geography-service:
    <<: *geography-vps
    build:
      context: ../..
      dockerfile: services/geography-service/Dockerfile
    container_name: sio-geography-service
    ports:
      - "127.0.0.1:${GEOGRAPHY_SERVICE_PORT:-8102}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

networks:
  sio-network:
    name: sio-network
    external: true
