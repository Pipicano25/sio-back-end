services:

  party-identity-db:
    image: postgres:17-alpine
    container_name: sio-party-identity-dev-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PARTY_IDENTITY_DB_NAME}
      POSTGRES_USER: ${PARTY_IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${PARTY_IDENTITY_DB_PASSWORD}

    ports:
      - "127.0.0.1:${PARTY_IDENTITY_DB_PORT:-55435}:5432"

    volumes:
      - party_identity_db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PARTY_IDENTITY_DB_USER} -d ${PARTY_IDENTITY_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  party-identity-test-db:
    image: postgres:17-alpine
    container_name: sio-party-identity-test-db
    profiles:
      - test
    restart: "no"

    environment:
      POSTGRES_DB: ${PARTY_IDENTITY_TEST_DB_NAME:-sio_party_identity_test}
      POSTGRES_USER: ${PARTY_IDENTITY_TEST_DB_USER:-sio_party_identity_test}
      POSTGRES_PASSWORD: ${PARTY_IDENTITY_TEST_DB_PASSWORD:-sio_party_identity_test_dev_change_me}

    ports:
      - "127.0.0.1:${PARTY_IDENTITY_TEST_DB_PORT:-55436}:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  party-identity-service:
    container_name: sio-party-identity-service-dev
    restart: unless-stopped

    build:
      context: ../..
      dockerfile: services/party-identity-service/Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${PARTY_IDENTITY_DB_USER}:${PARTY_IDENTITY_DB_PASSWORD}@party-identity-db:5432/${PARTY_IDENTITY_DB_NAME}

      # El JWT se emite con KEYCLOAK_PUBLIC_URL (infrastructure/.env) como issuer.
      # KEYCLOAK_HTTP_PORT debe coincidir con el puerto de esa URL.
      SIO_AUTH_ISSUER: http://localhost:${KEYCLOAK_HTTP_PORT:-8081}/realms/sio

      # Desde el contenedor, localhost sería el propio contenedor.
      # Para obtener las claves públicas usamos el host.
      SIO_AUTH_JWKS_URL: http://host.docker.internal:${KEYCLOAK_HTTP_PORT:-8081}/realms/sio/protocol/openid-connect/certs
      GEOGRAPHY_SERVICE_BASE_URL: http://host.docker.internal:${GEOGRAPHY_SERVICE_PORT:-8000}
      OPERATIONAL_CONTEXT_SERVICE_BASE_URL: http://host.docker.internal:${OPERATIONAL_CONTEXT_SERVICE_PORT:-8004}/api/v1
      KEYCLOAK_TOKEN_URL: http://host.docker.internal:${KEYCLOAK_HTTP_PORT:-8081}/realms/sio/protocol/openid-connect/token

    ports:
      - "${PARTY_IDENTITY_SERVICE_PORT:-8002}:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      party-identity-db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s


volumes:
  party_identity_db_data:
