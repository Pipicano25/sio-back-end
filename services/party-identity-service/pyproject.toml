[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "party-identity-service"
version = "0.1.0"
description = "Microservicio de identidades de personas y organizaciones de SIO."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",

    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "python-dotenv>=1.0,<2.0",

    "sio-auth @ file:../../libs/sio-auth",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]
# Solo para regenerar el snapshot CIIU (scripts/ciiu/convert_dane_ciiu.py);
# el servicio y su `seed` no lo usan.
tools = [
    "openpyxl>=3.1,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: pruebas opcionales contra Keycloak o Geography reales",
]

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["src/party_identity_service"]
