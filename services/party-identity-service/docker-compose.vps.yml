name: party-identity-service-vps

# Despliegue de party-identity-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/party-identity-service.yaml):
# - Proyecto "party-identity-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "party-identity-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API y a sus workers; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (party-identity-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8101 (docs/port-map.md), publicado solo en 127.0.0.1: el acceso público
#   pasa por el proxy inverso de la VPS.
#
# Desde la raíz del repositorio:
#   docker compose -f services/party-identity-service/docker-compose.vps.yml --env-file services/party-identity-service/.env.vps build
#   docker compose -f services/party-identity-service/docker-compose.vps.yml --env-file services/party-identity-service/.env.vps up -d

x-party-identity-vps: &party-identity-vps
  image: sio/party-identity-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  party-identity-service:
    <<: *party-identity-vps
    build:
      context: ../..
      dockerfile: services/party-identity-service/Dockerfile
    container_name: sio-party-identity-service
    ports:
      - "127.0.0.1:${PARTY_IDENTITY_SERVICE_PORT:-8101}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Entrega la outbox de auditoría a Audit.
  party-identity-audit-outbox-worker:
    <<: *party-identity-vps
    container_name: sio-party-identity-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  sio-network:
    name: sio-network
    external: true
