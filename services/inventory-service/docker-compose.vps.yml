name: inventory-service-vps

# Despliegue de inventory-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/inventory-service.yaml):
# - Proyecto "inventory-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "inventory-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API y a sus workers; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (inventory-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8109 (docs/port-map.md), publicado solo en 127.0.0.1. El acceso público
#   es https://inventory.2.25.76.203.sslip.io vía Traefik (labels de la API).
#
# Desde la raíz del repositorio:
#   docker compose -f services/inventory-service/docker-compose.vps.yml --env-file services/inventory-service/.env.vps build
#   docker compose -f services/inventory-service/docker-compose.vps.yml --env-file services/inventory-service/.env.vps up -d

x-inventory-vps: &inventory-vps
  image: sio/inventory-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  inventory-service:
    <<: *inventory-vps
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    container_name: sio-inventory-service
    ports:
      - "127.0.0.1:${INVENTORY_SERVICE_PORT:-8109}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sio-inventory.rule=Host(`inventory.2.25.76.203.sslip.io`)"
      - "traefik.http.routers.sio-inventory.entrypoints=websecure"
      - "traefik.http.routers.sio-inventory.tls=true"
      - "traefik.http.routers.sio-inventory.tls.certresolver=letsencrypt"
      - "traefik.http.services.sio-inventory.loadbalancer.server.port=8000"
      - "traefik.docker.network=sio-network"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Entrega la outbox de auditoría a Audit.
  inventory-audit-outbox-worker:
    <<: *inventory-vps
    container_name: sio-inventory-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  sio-network:
    name: sio-network
    external: true
