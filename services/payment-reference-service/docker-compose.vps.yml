name: payment-reference-service-vps

# Despliegue de payment-reference-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/payment-reference-service.yaml):
# - Proyecto "payment-reference-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "payment-reference-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (payment-reference-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8105 (docs/port-map.md), publicado solo en 127.0.0.1. El acceso público
#   es https://payments.2.25.76.203.sslip.io vía Traefik (labels de la API).
#
# Desde la raíz del repositorio:
#   docker compose -f services/payment-reference-service/docker-compose.vps.yml --env-file services/payment-reference-service/.env.vps build
#   docker compose -f services/payment-reference-service/docker-compose.vps.yml --env-file services/payment-reference-service/.env.vps up -d

x-payment-reference-vps: &payment-reference-vps
  image: sio/payment-reference-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  payment-reference-service:
    <<: *payment-reference-vps
    build:
      context: ../..
      dockerfile: services/payment-reference-service/Dockerfile
    container_name: sio-payment-reference-service
    ports:
      - "127.0.0.1:${PAYMENT_REFERENCE_SERVICE_PORT:-8105}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sio-payments.rule=Host(`payments.2.25.76.203.sslip.io`)"
      - "traefik.http.routers.sio-payments.entrypoints=websecure"
      - "traefik.http.routers.sio-payments.tls=true"
      - "traefik.http.routers.sio-payments.tls.certresolver=letsencrypt"
      - "traefik.http.services.sio-payments.loadbalancer.server.port=8000"
      - "traefik.docker.network=sio-network"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

networks:
  sio-network:
    name: sio-network
    external: true
