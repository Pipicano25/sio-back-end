[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "payment-reference-service"
version = "0.1.0"
description = "Catálogos globales de condiciones y métodos de pago de SIO."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",

    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "python-dotenv>=1.0,<2.0",

    "sio-auth @ file:../../libs/sio-auth",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    # sio-contract-read >= 0.1.0 (spec 025, D27): solo para probar que los roles lectores leen las vistas de
    # contrato. El servicio no lee vistas de otros, así que no es dependencia de ejecución ni va en el Dockerfile.
    "sio-contract-read @ file:../../libs/sio-contract-read",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: requiere el entorno integrado y Docker (pytest -m integration)",
]

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["src/payment_reference_service"]