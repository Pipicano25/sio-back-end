name: business-reporting-service-vps

# Despliegue de business-reporting-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/business-reporting-service.yaml):
# - Proyecto "business-reporting-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "business-reporting-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API; misma imagen para todos, solo cambia el comando.
# - Sin base de datos.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (business-reporting-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8113 (docs/port-map.md), publicado solo en 127.0.0.1: el acceso público
#   pasa por el proxy inverso de la VPS.
#
# Desde la raíz del repositorio:
#   docker compose -f services/business-reporting-service/docker-compose.vps.yml --env-file services/business-reporting-service/.env.vps build
#   docker compose -f services/business-reporting-service/docker-compose.vps.yml --env-file services/business-reporting-service/.env.vps up -d

x-business-reporting-vps: &business-reporting-vps
  image: sio/business-reporting-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  business-reporting-service:
    <<: *business-reporting-vps
    build:
      context: ../..
      dockerfile: services/business-reporting-service/Dockerfile
    container_name: sio-business-reporting-service
    ports:
      - "127.0.0.1:${BUSINESS_REPORTING_SERVICE_PORT:-8113}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

networks:
  sio-network:
    name: sio-network
    external: true
