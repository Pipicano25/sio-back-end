name: commercial-relationship-service-vps

# Despliegue de commercial-relationship-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/commercial-relationship-service.yaml):
# - Proyecto "commercial-relationship-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "commercial-relationship-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API y a sus workers; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (commercial-relationship-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8106 (docs/port-map.md), publicado solo en 127.0.0.1: el acceso público
#   pasa por el proxy inverso de la VPS.
#
# Desde la raíz del repositorio:
#   docker compose -f services/commercial-relationship-service/docker-compose.vps.yml --env-file services/commercial-relationship-service/.env.vps build
#   docker compose -f services/commercial-relationship-service/docker-compose.vps.yml --env-file services/commercial-relationship-service/.env.vps up -d

x-commercial-relationship-vps: &commercial-relationship-vps
  image: sio/commercial-relationship-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  commercial-relationship-service:
    <<: *commercial-relationship-vps
    build:
      context: ../..
      dockerfile: services/commercial-relationship-service/Dockerfile
    container_name: sio-commercial-relationship-service
    ports:
      - "127.0.0.1:${COMMERCIAL_RELATIONSHIP_SERVICE_PORT:-8106}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Entrega la outbox de auditoría a Audit.
  commercial-relationship-audit-outbox-worker:
    <<: *commercial-relationship-vps
    container_name: sio-commercial-relationship-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # Aplica las políticas de precio automático (spec 021); solo usa su base.
  commercial-relationship-price-worker:
    <<: *commercial-relationship-vps
    container_name: sio-commercial-relationship-price-worker
    command: ["python", "-m", "commercial_relationship_service.price_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "commercial_relationship_service.price_worker", "--check"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  sio-network:
    name: sio-network
    external: true
