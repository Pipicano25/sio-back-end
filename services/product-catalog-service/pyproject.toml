[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "product-catalog-service"
version = "0.1.0"
description = "Microservicio del catálogo global y compartido de productos de SIO."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",

    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "python-dotenv>=1.0,<2.0",

    "sio-auth @ file:../../libs/sio-auth",
    "sio-audit @ file:../../libs/sio-audit",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration and not performance'"
markers = [
    "integration: pruebas que requieren Keycloak u otra infraestructura real",
    "performance: pruebas de volumen para SC-002 y SC-003",
]

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["src/product_catalog_service"]
