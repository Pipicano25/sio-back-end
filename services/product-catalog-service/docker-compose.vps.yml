name: product-catalog-service-vps

# Despliegue de product-catalog-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/product-catalog-service.yaml):
# - Proyecto "product-catalog-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "product-catalog-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API y a sus workers; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (product-catalog-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8103 (docs/port-map.md), publicado solo en 127.0.0.1: el acceso público
#   pasa por el proxy inverso de la VPS.
#
# Desde la raíz del repositorio:
#   docker compose -f services/product-catalog-service/docker-compose.vps.yml --env-file services/product-catalog-service/.env.vps build
#   docker compose -f services/product-catalog-service/docker-compose.vps.yml --env-file services/product-catalog-service/.env.vps up -d

x-product-catalog-vps: &product-catalog-vps
  image: sio/product-catalog-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  product-catalog-service:
    <<: *product-catalog-vps
    build:
      context: ../..
      dockerfile: services/product-catalog-service/Dockerfile
    container_name: sio-product-catalog-service
    ports:
      - "127.0.0.1:${PRODUCT_CATALOG_SERVICE_PORT:-8103}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Entrega la outbox de auditoría a Audit con el cliente técnico product-catalog-service.
  product-catalog-audit-outbox-worker:
    <<: *product-catalog-vps
    container_name: sio-product-catalog-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  sio-network:
    name: sio-network
    external: true
