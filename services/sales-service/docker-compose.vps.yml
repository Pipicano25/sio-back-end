name: sales-service-vps

# Despliegue de sales-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/sales-service.yaml):
# - Proyecto "sales-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "sales-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API y a sus workers; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (sales-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8108 (docs/port-map.md), publicado solo en 127.0.0.1. El acceso público
#   es https://sales.2.25.76.203.sslip.io vía Traefik (labels de la API).
#
# Desde la raíz del repositorio:
#   docker compose -f services/sales-service/docker-compose.vps.yml --env-file services/sales-service/.env.vps build
#   docker compose -f services/sales-service/docker-compose.vps.yml --env-file services/sales-service/.env.vps up -d

x-sales-vps: &sales-vps
  image: sio/sales-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  sales-service:
    <<: *sales-vps
    build:
      context: ../..
      dockerfile: services/sales-service/Dockerfile
    container_name: sio-sales-service
    ports:
      - "127.0.0.1:${SALES_SERVICE_PORT:-8108}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sio-sales.rule=Host(`sales.2.25.76.203.sslip.io`)"
      - "traefik.http.routers.sio-sales.entrypoints=websecure"
      - "traefik.http.routers.sio-sales.tls=true"
      - "traefik.http.routers.sio-sales.tls.certresolver=letsencrypt"
      - "traefik.http.services.sio-sales.loadbalancer.server.port=8000"
      - "traefik.docker.network=sio-network"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  # Entrega la outbox de auditoría a Audit.
  sales-audit-outbox-worker:
    <<: *sales-vps
    container_name: sio-sales-audit-outbox-worker
    command: ["python", "-m", "sio_audit.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "sio_audit.worker", "--check"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # Concilia (o compensa) operaciones PENDING consultando Inventory por clave.
  sales-reconciler:
    <<: *sales-vps
    container_name: sio-sales-reconciler
    command: ["python", "-m", "sales_service.reconciler"]
    healthcheck:
      test: ["CMD", "python", "-m", "sales_service.reconciler", "--check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  sio-network:
    name: sio-network
    external: true
