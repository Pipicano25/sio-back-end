name: audit-service-vps

# Despliegue de audit-service en la VPS (Docker Compose). No reemplaza ni modifica la definición de
# desarrollo (infrastructure/services/audit-service.yaml):
# - Proyecto "audit-service-vps": en un equipo de desarrollo no toma los contenedores del proyecto
#   "audit-service" (un `up` falla por nombre de contenedor repetido en vez de recrearlos).
# - Configuración: .env.vps de esta carpeta (plantilla .env.vps.example), entregada como
#   env_file a la API; misma imagen para todos, solo cambia el comando.
# - Base: contenedor existente sio-postgres-18 (PostgreSQL 18) en sio-network; este archivo NO crea
#   bases ni ejecuta migraciones o seeds.
# - Red externa sio-network (debe existir: `docker network create sio-network`). Los alias de
#   servicio (audit-service, keycloak, audit-service...) son los nombres DNS entre contenedores.
# - Puerto del host 8110 (docs/port-map.md), publicado solo en 127.0.0.1. El acceso público
#   es https://audit.2.25.76.203.sslip.io vía Traefik (labels de la API).
#
# Desde la raíz del repositorio:
#   docker compose -f services/audit-service/docker-compose.vps.yml --env-file services/audit-service/.env.vps build
#   docker compose -f services/audit-service/docker-compose.vps.yml --env-file services/audit-service/.env.vps up -d

x-audit-vps: &audit-vps
  image: sio/audit-service:${SIO_SERVICES_VERSION:-0.1.0}
  restart: unless-stopped
  env_file:
    - .env.vps
  networks:
    - sio-network

services:
  audit-service:
    <<: *audit-vps
    build:
      context: ../..
      dockerfile: services/audit-service/Dockerfile
    container_name: sio-audit-service
    ports:
      - "127.0.0.1:${AUDIT_SERVICE_PORT:-8110}:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sio-audit.rule=Host(`audit.2.25.76.203.sslip.io`)"
      - "traefik.http.routers.sio-audit.entrypoints=websecure"
      - "traefik.http.routers.sio-audit.tls=true"
      - "traefik.http.routers.sio-audit.tls.certresolver=letsencrypt"
      - "traefik.http.services.sio-audit.loadbalancer.server.port=8000"
      - "traefik.docker.network=sio-network"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

networks:
  sio-network:
    name: sio-network
    external: true
