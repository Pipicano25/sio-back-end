# Entorno de desarrollo independiente de operational-context-service (Principio IV).
# Nombres de contenedor y puertos distintos de los de infrastructure/compose.yaml.
services:
  operational-context-dev-db:
    image: postgres:17-alpine
    container_name: sio-operational-context-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OPERATIONAL_CONTEXT_DB_NAME:-sio_operational_context}
      POSTGRES_USER: ${OPERATIONAL_CONTEXT_DB_USER:-sio_operational_context}
      POSTGRES_PASSWORD: ${OPERATIONAL_CONTEXT_DB_PASSWORD:-sio_operational_context_dev_change_me}
    ports:
      - "127.0.0.1:${OPERATIONAL_CONTEXT_DB_PORT:-55439}:5432"
    volumes:
      - operational_context_dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  operational-context-test-db:
    image: postgres:17-alpine
    container_name: sio-operational-context-test-db
    profiles:
      - test
    restart: "no"
    environment:
      POSTGRES_DB: ${OPERATIONAL_CONTEXT_TEST_DB_NAME:-sio_operational_context_test}
      POSTGRES_USER: ${OPERATIONAL_CONTEXT_TEST_DB_USER:-sio_operational_context_test}
      POSTGRES_PASSWORD: ${OPERATIONAL_CONTEXT_TEST_DB_PASSWORD:-sio_operational_context_test_dev_change_me}
    ports:
      - "127.0.0.1:${OPERATIONAL_CONTEXT_TEST_DB_PORT:-55440}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  operational-context-service:
    container_name: sio-operational-context-service-dev
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/operational-context-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${OPERATIONAL_CONTEXT_DB_USER:-sio_operational_context}:${OPERATIONAL_CONTEXT_DB_PASSWORD:-sio_operational_context_dev_change_me}@operational-context-dev-db:5432/${OPERATIONAL_CONTEXT_DB_NAME:-sio_operational_context}
      # El JWT se emite con localhost:8081 como issuer; este valor no debe cambiar.
      SIO_AUTH_ISSUER: http://localhost:8081/realms/sio
      # Desde el contenedor, localhost es el propio contenedor: las claves se leen del host.
      SIO_AUTH_JWKS_URL: http://host.docker.internal:8081/realms/sio/protocol/openid-connect/certs
      PARTY_IDENTITY_SERVICE_BASE_URL: http://host.docker.internal:8002/api/v1
      GEOGRAPHY_SERVICE_BASE_URL: http://host.docker.internal:8000
    ports:
      - "${OPERATIONAL_CONTEXT_SERVICE_PORT:-8004}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      operational-context-dev-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  operational_context_dev_db_data:
