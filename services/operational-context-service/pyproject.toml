[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "operational-context-service"
version = "0.1.0"
description = "Microservicio de contexto operativo de SIO: empresas y sucursales."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",

    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "python-dotenv>=1.0,<2.0",

    # Base IANA reproducible en Windows, en la imagen slim y en pruebas (R-08).
    "tzdata>=2024.1",
    # Validación de correo para EmailStr (R-08).
    "email-validator>=2.1,<3.0",

    "sio-auth @ file:../../libs/sio-auth",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: pruebas opcionales contra Keycloak, Party Identity y Geography reales",
]

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["src/operational_context_service"]
